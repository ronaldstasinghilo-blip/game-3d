<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>City Life 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div class="brand">CITY LIFE <span>3D</span></div>
    <div class="mission">Explore your hometown</div>
    <div id="status">Loading city...</div>
  </div>
  <div id="hint">WASD / Arrow keys to move · Drag to look around</div>
  <div id="mobile-controls">
    <div class="pad">
      <button data-move="forward">▲</button>
      <div class="pad-row">
        <button data-move="left">◀</button>
        <button data-move="back">▼</button>
        <button data-move="right">▶</button>
      </div>
    </div>
    <button id="jump">JUMP</button>
  </div>
  <div id="loading">Building your town...</div>
  <script type="module" src="game.js"></script>
</body>
</html>
